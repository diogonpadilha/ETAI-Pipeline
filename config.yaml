# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  # id/COMPAS's-own-score dropped as before, plus the three columns week 3's multicollinearity
  # check found redundant (see src/data_diagnostics.py + the EDA notebook's VIF walkthrough)
  drop_columns: ["id", "decile_score", "score_text", "prior_offenses", "age_in_months", "juvenile_total"]

split:
  test_size: 0.2
  random_state: 42

diagnostics:
  id_column: "id"
  candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]
  numeric_text_columns: ["priors_count", "prior_offenses"]
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", ""]
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

# Configuração de Feature Engineering
feature_engineering:
  enabled: true
  add_aggregates: true
  add_ratios: true
  add_flags: true
  add_log_transforms: true

preprocessing:
  encoder: "target"      # winner of the 4x4 empirical grid
  scaler: "robust"     
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  passthrough_features: ["has_priors", "has_juv_record"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

model:
  type: "adaboost"
  params: {}

cv:
  n_splits: 5
  random_state: 42
  scoring: "accuracy"

tuning:
  enabled: true
  n_trials: 20
  search_spaces:
    decision_tree:
      model__max_depth: {type: "int", low: 2, high: 15}
      model__min_samples_split: {type: "int", low: 2, high: 50}
      model__criterion: {type: "categorical", choices: ["gini", "entropy"]}
    random_forest:
      model__max_depth: {type: "int", low: 2, high: 20}
      model__n_estimators: {type: "int", low: 50, high: 200}
    logistic_regression:
      model__C: {type: "float", low: 0.01, high: 10.0, log: true}
      model__max_iter: {type: "int", low: 1000, high: 3000}
    oblique_random_forest:
      model__estimator__tree__max_depth: {type: "int", low: 2, high: 30}
      model__estimator__tree__min_samples_leaf: {type: "int", low: 1, high: 200, log: true}
      model__estimator__project__n_components: {type: "int", low: 3, high: 10}

    adaboost:
      model__n_estimators: {type: "int", low: 50, high: 200}
      model__learning_rate: {type: "float", low: 0.01, high: 1.0, log: true}
output:
  results_dir: "results"